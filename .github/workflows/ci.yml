name: Extension CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: sheets-vscode-${{ matrix.os }}
          path: artifacts/*.vsix
          if-no-files-found: error
