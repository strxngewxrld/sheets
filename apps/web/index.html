<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheets</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { background: #fff; color: #1f1f1f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #e3e3e3; } }
      #app { display: flex; height: 100vh; }
      #sheet { flex: 1; min-width: 0; position: relative; }
      #drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 100;
        background: rgba(26,115,232,.12); border: 3px dashed #1a73e8; font-size: 18px; pointer-events: none; }
      #drop.on { display: flex; }
      #agent { width: 360px; display: none; flex-direction: column; border-left: 1px solid rgba(128,128,128,.3); font-size: 13px; }
      #agent.open { display: flex; }
      #agent header { padding: 8px 12px; font-weight: 600; border-bottom: 1px solid rgba(128,128,128,.3); display: flex; justify-content: space-between; align-items: center; }
      #agent .body { padding: 10px 12px; display: grid; gap: 8px; overflow: auto; }
      #agent select, #agent textarea, #agent button { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(128,128,128,.45); border-radius: 4px; }
      #agent select { height: 28px; }
      #agent textarea { min-height: 140px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; padding: 6px; resize: vertical; }
      #agent button { height: 30px; cursor: pointer; }
      #agent button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
      #agent pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; background: rgba(128,128,128,.1); padding: 8px; border-radius: 4px; max-height: 45vh; overflow: auto; }
      #agent p { margin: 0; color: #777; font-size: 12px; }
      @media (max-width: 800px) { #agent.open { position: fixed; inset: auto 0 0 0; width: auto; height: 55vh; background: inherit; z-index: 200; border-left: 0; border-top: 1px solid rgba(128,128,128,.3); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="sheet"><div id="drop">Datei hier ablegen (.xlsx, .csv)</div></div>
      <aside id="agent" aria-label="Agent console">
        <header><span>Agent API</span><button id="agent-close" aria-label="Close">✕</button></header>
        <div class="body">
          <p>Führt Tool-Calls aus, wie sie ein AI-Agent senden würde. Jeder Aufruf ist ein Undo-Schritt.</p>
          <select id="agent-tool" aria-label="Tool"></select>
          <p id="agent-desc"></p>
          <textarea id="agent-input" aria-label="Input JSON" spellcheck="false"></textarea>
          <button id="agent-run" class="primary">Ausführen</button>
          <pre id="agent-output" aria-live="polite"></pre>
        </div>
      </aside>
    </div>
    <input type="file" id="file" accept=".xlsx,.xlsm,.csv,.tsv,.txt,.json" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
